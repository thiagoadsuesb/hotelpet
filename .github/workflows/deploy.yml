# Fluxo de trabalho para publicacao estatica no GitHub Pages
name: Deploy estatico no Pages

on:
  # Executa em pushes na branch principal
  push:
    branches: ["main"]

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

# Define permissoes do GITHUB_TOKEN para permitir deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez, ignorando execucoes enfileiradas entre o deploy em andamento e o mais recente.
# Nao cancela execucoes em andamento para permitir que deploys de producao sejam concluidos.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Unico job de deploy, pois e apenas conteudo estatico
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          # Faz upload de todo o repositorio
          path: '.'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
